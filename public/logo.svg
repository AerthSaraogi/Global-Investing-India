<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="giiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <rect width="96" height="96" x="2" y="2" rx="20" fill="none" stroke="rgba(56, 189, 248, 0.45)" stroke-width="2.5"/>
  
  <!-- Subtle Global Meridian Lines -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2.5"/>
  <ellipse cx="50" cy="50" rx="17" ry="34" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
  <line x1="16" y1="50" x2="84" y2="50" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>

  <!-- GII Monogram -->
  <text x="50" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif" font-weight="900" font-size="27" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">GII</text>
</svg>
