  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect width="96" height="96" x="2" y="2" rx="20" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  
  <!-- Globe / Ring -->
